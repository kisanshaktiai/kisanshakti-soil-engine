name: On-demand SoilGrids processing

on:
  workflow_dispatch:
    inputs:
      max_jobs:
        description: 'Queued jobs to process in this run (1-100). Raise only for a one-time backfill.'
        required: false
        default: '8'
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: soilgrids-queue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soil-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: soil-worker
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SOILGRIDS_SOURCE_VERSION: ${{ vars.SOILGRIDS_SOURCE_VERSION }}
      # Passed through env, never interpolated into the script. Scheduled runs have no inputs.
      MAX_JOBS: ${{ inputs.max_jobs || '8' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install provider dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify required configuration
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SOILGRIDS_SOURCE_VERSION"
      - name: Process queued soil jobs
        run: python -m soil_ingestion.worker --batch --max-jobs "$MAX_JOBS" --max-seconds 2400
